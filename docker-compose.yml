# ============================================================
# Docker Compose для бота инвентаризации + веб-панели
# ============================================================
# Сервисы:
#   bot   — Telegram-бот (bot.py)
#   web   — FastAPI веб-панель (web_app.py) — http://localhost:5000
#   redis — опционально, FSM storage (если REDIS_URL=redis://redis:6379/0)
#   caddy — опционально, HTTPS reverse proxy (если нужен публичный доступ)
# ============================================================
# Запуск:
#   docker compose up -d bot web              # только бот + панель
#   docker compose up -d                      # все сервисы
#   docker compose up -d --scale web=1        # с масштабированием
#
# Логи:
#   docker compose logs -f bot
#   docker compose logs -f web
#
# Остановка:
#   docker compose down
#   docker compose down -v                    # удалить volumes (Redis, Caddy)
# ============================================================

services:
  bot:
    build: .
    image: inventory_bot:latest
    container_name: inventory_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./labels:/app/labels
    networks:
      - inventory_net

  web:
    build: .
    image: inventory_bot:latest
    container_name: inventory_web
    restart: unless-stopped
    command: python web_app.py
    env_file: .env
    environment:
      - WEB_PANEL_HOST=0.0.0.0
      - WEB_PANEL_PORT=5000
    ports:
      - "127.0.0.1:5000:5000"  # только с этой машины — Caddy/Nginx проксируют наружу
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - inventory_net
    depends_on:
      - bot

  # Redis для FSM storage (опционально).
  # Используется, если в .env задано REDIS_URL=redis://redis:6379/0.
  # Если не используете — закомментируйте или удалите.
  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - inventory_net
    # Если нужен пароль:
    # command: ["redis-server", "--appendonly", "yes", "--requirepass", "your_redis_password"]
    # И в .env: REDIS_URL=redis://:your_redis_password@redis:6379/0

  # Caddy для HTTPS (опционально, для публичного доступа).
  # Сам получает Let's Encrypt-сертификаты и продлевает.
  # Раскомментируйте и укажите ваш домен в Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: inventory_caddy
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP → редирект на HTTPS
      - "443:443"  # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - inventory_net
    depends_on:
      - web

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  inventory_net:
    driver: bridge
