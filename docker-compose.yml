# ============================================================
# Docker Compose для бота инвентаризации + веб-панели
# ============================================================
# Сервисы:
#   bot   — Telegram-бот (bot.py)
#   web   — FastAPI веб-панель (web_app.py) — http://IP:5000
#   redis — опционально, FSM storage (если REDIS_URL=redis://redis:6379/0)
#   caddy — ОПЦИОНАЛЬНО, HTTPS reverse proxy (закомментирован по умолчанию)
# ============================================================
# Запуск:
#   docker compose up -d                      # бот + панель + redis
#   docker compose logs -f bot
#   docker compose down
# ============================================================

services:
  bot:
    build: .
    image: inventory_bot:latest
    container_name: inventory_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./labels:/app/labels
    networks:
      - inventory_net
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    image: inventory_bot:latest
    container_name: inventory_web
    restart: unless-stopped
    command: python web_app.py
    env_file: .env
    environment:
      - WEB_PANEL_HOST=0.0.0.0
      - WEB_PANEL_PORT=5000
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - inventory_net
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/stats"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis для FSM storage (опционально).
  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - inventory_net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Caddy для HTTPS (ОПЦИОНАЛЬНО — раскомментируйте если нужен HTTPS).
  # Сначала настройте домен в Caddyfile и WEB_PANEL_FORCE_HTTPS=true в .env.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: inventory_caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - inventory_net
  #   depends_on:
  #     - web
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  inventory_net:
    driver: bridge
