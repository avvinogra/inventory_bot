version: '3.8'

services:
  inventory-bot:
    build: .
    container_name: inventory-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Сохраняем базу данных
      - ./data:/app/data
      # Сохраняем сгенерированные этикетки
      - ./labels:/app/labels
    # Логи для отладки
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Сеть
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge