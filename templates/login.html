{% extends "base.html" %}

{% block title %}Вход • Инвентаризация{% endblock %}
{% block page_title %}Вход{% endblock %}

{% block content %}
  <div class="max-w-md mx-auto mt-12">
    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-700/50 font-semibold flex items-center gap-2">
        <i class="bi bi-lock"></i>Вход в панель
      </div>
      <div class="p-6">
        {% if error %}
        <div class="bg-bad-500/15 border border-bad-500/30 text-bad-500 rounded-lg p-3 mb-4 text-sm">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login_submit') }}">
          <label class="block text-sm text-slate-400 mb-1">Пароль</label>
          <input type="password" name="password" autofocus
                 class="w-full px-3 py-2.5 bg-slate-900/60 border border-slate-700 rounded-lg text-slate-100
                        placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 mb-4"
                 placeholder="Введите пароль">
          <button type="submit"
                  class="w-full px-3 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">
            <i class="bi bi-box-arrow-in-right me-1"></i>Войти
          </button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
